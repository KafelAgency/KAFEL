/* ============ Tokens ============ */
:root{
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;--s9:96px;
  --r-sm:10px;--r-md:16px;--r-lg:24px;
  --bar-h:64px;
  --t-fast:160ms;--t-med:320ms;--t-slow:520ms;
  --ease:cubic-bezier(.22,.8,.3,1);
  --maxw:1200px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1D2F;--bg2:#0B1726;--surface:#15283F;--surface2:#1B3250;
  --text:#F2F5FA;--muted:#A9B7CB;
  --border:rgba(169,183,203,.20);--border-strong:rgba(169,183,203,.42);
  --accent:#E3B34D;--accent-text:#E3B34D;--on-accent:#0E1D2F;
  --cta-bg:#E3B34D;--cta-fg:#0E1D2F;--cta-hover:#EEC265;
  --ok:#5FD3A0;--warn:#FFB86B;--danger:#FF8A80;
  --ring:#8FC1FF;
  --shadow:0 18px 40px -18px rgba(0,0,0,.65);
  --mark-a:#FFFFFF;--mark-b:#E3B34D;
  --glow:rgba(227,179,77,.09);--grid:rgba(169,183,203,.07);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F5F7FB;--bg2:#EBEFF6;--surface:#FFFFFF;--surface2:#F0F3F9;
  --text:#13213A;--muted:#4A5873;
  --border:rgba(19,33,58,.14);--border-strong:rgba(19,33,58,.5);
  --accent:#E3B34D;--accent-text:#8A5F00;--on-accent:#13213A;
  --cta-bg:#1D3150;--cta-fg:#FFFFFF;--cta-hover:#2A4470;
  --ok:#0F7A4F;--warn:#9A5B00;--danger:#B3261E;
  --ring:#1D4ED8;
  --shadow:0 18px 40px -22px rgba(19,33,58,.35);
  --mark-a:#1D3150;--mark-b:#1D3150;
  --glow:rgba(227,179,77,.28);--grid:rgba(19,33,58,.06);
}
/* ============ Base ============ */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--bar-h) + 8px)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;font-family:var(--font);font-size:1rem;line-height:1.6;color:var(--text);background:var(--bg);
  transition:background-color var(--t-med) var(--ease),color var(--t-med) var(--ease);overflow-x:hidden}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
h1,h2,h3{line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
p{text-wrap:pretty}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:3px;border-radius:6px}
.i{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:16px;top:-80px;z-index:200;background:var(--cta-bg);color:var(--cta-fg);padding:10px 16px;border-radius:var(--r-sm);font-weight:700;text-decoration:none;transition:top var(--t-fast)}
.skip:focus{top:12px}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:max(var(--s4),env(safe-area-inset-left),env(safe-area-inset-right))}
@media (min-width:700px){.wrap{padding-inline:var(--s6)}}

/* ============ Barra superior ============ */
.bar{position:fixed;inset:0 0 auto 0;height:var(--bar-h);z-index:100;display:flex;align-items:center;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border)}
.bar .wrap{display:flex;align-items:center;gap:var(--s4)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;letter-spacing:.06em;font-size:1.125rem;min-height:44px}
.mark{width:40px;aspect-ratio:300/218;background:var(--text);-webkit-mask:var(--logo-icon) center/contain no-repeat;mask:var(--logo-icon) center/contain no-repeat;flex:none}
.links{display:none;margin-inline:auto;gap:2px}
.links a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9375rem;transition:color var(--t-fast),background var(--t-fast)}
.links a:hover{color:var(--text);background:var(--surface)}
.links a[aria-current="true"]{color:var(--text);background:var(--surface2)}
@media (min-width:1100px){.links{display:flex}}
.ctrls{display:flex;align-items:center;gap:var(--s2);margin-left:auto}
@media (min-width:1100px){.ctrls{margin-left:0}}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;min-width:44px;min-height:44px;padding:0 10px;border-radius:999px;font-weight:700;font-size:.875rem;color:var(--muted);transition:background var(--t-fast),color var(--t-fast)}
.seg button[aria-pressed="true"]{background:var(--cta-bg);color:var(--cta-fg)}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);transition:background var(--t-fast),transform var(--t-fast)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn:active{transform:scale(.95)}
[data-theme="dark"] .only-light,[data-theme="light"] .only-dark{display:none}
.progress{position:fixed;left:0;top:0;height:3px;width:100%;z-index:150;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--accent)}

/* ============ Animación de arranque ============ */
html.booting{overflow:hidden}
.boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--bg);overflow:hidden;cursor:pointer;
  transition:opacity .55s var(--ease),transform .55s var(--ease),visibility 0s linear .55s}
.boot.done{opacity:0;visibility:hidden;transform:scale(1.05)}
.boot-grid{position:absolute;inset:0;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px;
  -webkit-mask:radial-gradient(circle at center,#000 15%,transparent 72%);mask:radial-gradient(circle at center,#000 15%,transparent 72%);animation:bootgrid 2.4s ease-out both}
.boot-core{position:relative;display:grid;justify-items:center;gap:20px;padding:24px;width:min(760px,100%)}
.boot-circuit{position:absolute;left:50%;top:38%;width:min(760px,96vw);transform:translate(-50%,-50%);overflow:visible;pointer-events:none}

.disc{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);width:100%;min-height:56px;padding:12px 18px;text-align:left;font-weight:700;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--r-md);transition:background var(--t-fast),border-color var(--t-fast)}

.disc[aria-expanded="true"]{border-color:var(--accent)}
.disc[aria-expanded="true"] .i{transform:rotate(180deg)}
.disc-body{padding-top:var(--s4)}
.pickgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:820px){.checks.cols{display:block;columns:2;column-gap:32px}.checks.cols li{break-inside:avoid;margin-bottom:12px}}

.step-pill{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.8125rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.pick .pcta{margin-top:8px;font-size:.75rem;font-weight:700;line-height:1.25;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}
.pick[aria-expanded="true"] .pcta{text-decoration:none;color:var(--text)}
.plan-empty{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);border:1.5px dashed var(--accent);border-radius:var(--r-md);background:color-mix(in srgb,var(--accent) 8%,transparent);font-weight:600}
.plan-empty .i{flex:none;color:var(--accent-text);width:1.5em;height:1.5em;transform:rotate(180deg)}
.plan-empty[hidden]{display:none}
.pickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:136px;padding:14px 6px;text-align:center;border-radius:var(--r-md);border:1.5px solid var(--border-strong);background:var(--bg);transition:transform var(--t-fast),border-color var(--t-fast),background var(--t-fast)}
.pick:hover{transform:translateY(-2px);border-color:var(--accent)}
.pick[aria-expanded="true"]{border-color:var(--accent);background:var(--surface2);box-shadow:0 0 0 1px var(--accent) inset}
.pick .nm{font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pick b{font-size:1.75rem;line-height:1.15;font-weight:800;color:var(--accent-text);font-variant-numeric:tabular-nums}

.pick[aria-expanded="true"] .tick{display:grid}
.pick .tick .i{width:.85em;height:.85em;stroke-width:3}

.steps{display:grid;gap:var(--s4);counter-reset:step}

.step h3{font-size:1.1875rem;font-weight:800;margin-bottom:8px}
.step p{color:var(--muted);font-size:.9375rem}

#contacto .cta-row{justify-content:center}

      '<h3>' + svg(p.icon) + '<span>' + t(p.id + '.t') + '</span></h3>' +

      '<button type="button" class="link-btn" data-go="' + p.service + '"><span>' + t('prob.go') + '</span>' + svg('arrow-r') + '</button></div>' +
      '</div></div></article>';
  }).join('');

}
function updateToggleAll() {
  var cards = $$('.pcard'); var all = cards.length && cards.every(function (c) { return c.classList.contains('open'); });
  var b = $('#toggleAll'); if (!b) return;
  b.setAttribute('aria-pressed', all ? 'true' : 'false');
  $('#toggleAllTxt').textContent = t(all ? 'prob.hideAll' : 'prob.showAll');
}
function setCard(card, open) {
  card.classList.toggle('open', open);
  var col = $('.collapse', card); col.classList.toggle('open', open);
  if (open) col.removeAttribute('inert'); else col.setAttribute('inert', '');
  var b = $('.reveal-btn', card); b.setAttribute('aria-expanded', open);
  $('span', b).textContent = t(open ? 'prob.hide' : 'prob.show');
}

function featList(feats, cols) {
  return '<ul class="checks' + (cols ? ' cols' : '') + '">' + feats.map(function (f) {
    return '<li>' + svg('check') + '<span' + (f[2] ? ' class="hot"' : '') + '>' + t(f[0]) + (f[1] ? '<small>' + t(f[1]) + '</small>' : '') + '</span></li>';
  }).join('') + '</ul>';
}
function renderInvPlans() {
  var pick = $('#invPick'); if (!pick) return;
  pick.innerHTML = INV_PLANS.map(function (p) {
    var on = selInv === p.id;
    return '<button type="button" class="pick" data-invplan="' + p.id + '" aria-expanded="' + on + '" aria-controls="invDetail">' +
      '<span class="tick">' + svg('check') + '</span>' +
      '<span class="nm">' + t('inv.short.' + p.id) + '</span>' +
      '<b' + (p.limit ? '' : ' class="sm"') + '>' + (p.limit || t('plan.unlimited')) + '</b>' +
      '<span class="u">' + t('inv.unit.' + p.id) + '</span>' +
      '<span class="pcta">' + t(on ? 'plans.selected' : 'inv.cta') + '</span></button>';
  }).join('');
  var emp = $('#invEmpty'); if (emp) emp.hidden = !!selInv;
  var hint = $('#invHint'); if (hint) hint.hidden = !!selInv;
  var det = $('#invDetail');
  if (!selInv) { setCollapse(det, false); return; }
  var p = INV_PLANS.filter(function (x) { return x.id === selInv; })[0];
  $('#invDetailBody').innerHTML = '<article class="pdetail"><div class="pd-head"><div>' +
    '<div class="price" style="font-size:clamp(1.75rem,1.2rem + 2.2vw,2.5rem)">' + t('inv.name.' + p.id) + '</div>' +
    '<span class="price-sub">' + t('inv.sub.' + p.id) + '</span></div></div>' +
    '<div><h3>' + t('pd.includes') + '</h3>' + featList(p.feats.map(function (k) { return [k]; }), true) + '</div></article>';
  setCollapse(det, true);
}
function renderAgPro() {
  var host = $('#agProBody'); if (!host) return;
  host.innerHTML = '<article class="pdetail"><div class="pd-head"><div>' +
    '<span class="plan-name" style="font-size:.8125rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)">' + t('ag.label') + '</span>' +
    '<div class="price" style="font-size:clamp(1.75rem,1.2rem + 2.2vw,2.5rem)">' + t('ag.title') + '</div>' +
    '<span class="price-sub">' + t('ag.sub') + '</span></div></div>' +
    '<div><h3>' + t('ag.inc') + '</h3>' + featList(AGENDA_FEATS, true) + '</div></article>';
}
function setCollapse(el, open) {
  el.classList.toggle('open', open);
  if (open) el.removeAttribute('inert'); else el.setAttribute('inert', '');
}
function renderPlans() {
  var pick = $('#planPick'); if (!pick) return;
  pick.innerHTML = PLANS.map(function (p) {
    var on = selPlan === p.id;
    return '<button type="button" class="pick" data-plan="' + p.id + '" aria-expanded="' + on + '" aria-controls="planDetail">' +
      '<span class="tick">' + svg('check') + '</span>' +
      '<span class="nm">' + t('plan.short.' + p.id) + '</span>' +
      '<b' + (p.limit ? '' : ' class="sm"') + '>' + (p.limit || t('plan.unlimited')) + '</b>' +
      '<span class="u">' + (p.limit ? t(p.unit) : '') + '</span>' +
      '<span class="pcta">' + t(on ? 'plans.selected' : 'plans.cta') + '</span></button>';
  }).join('');
  var det = $('#planDetail'), body = $('#planDetailBody');
  var emp = $('#planEmpty'); if (emp) emp.hidden = !!selPlan;
  var hint = $('.pick-hint'); if (hint) hint.hidden = !!selPlan;
  if (!selPlan) { setCollapse(det, false); return; }
  var p = PLANS.filter(function (x) { return x.id === selPlan; })[0];
  var works = WORKS.filter(function (w) { return w.plan === p.id; });
  body.innerHTML =
    '<article class="pdetail">' +
      '<div class="pd-head"><div><span class="plan-name" style="font-size:.8125rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)">' + t('plan.' + p.id) + '</span>' +
      '<div class="price">' + p.price + '</div><span class="price-sub">' + t('pd.once') + ' · ' + t('pd.cop') + '</span></div>' +
      '<div class="limit"><b>' + (p.limit || t('plan.unlimited')) + '</b><span>' + t(p.unit) + '</span></div></div>' +
      '<div class="pd-grid">' +
        '<div><h3>' + t('pd.includes') + '</h3>' + featList(p.feats) + '</div>' +
        '<div><h3>' + t('pd.examples') + ' (' + works.length + ')</h3><div class="exlist">' + works.map(function (w) {
          var d = lang === 'en' ? (w.en || w.es) : (w.es || w.en);
          return '<a class="exitem" href="' + esc(w.url) + '" target="_blank" rel="noopener noreferrer"><span><b>' + esc(w.name) + '</b><span class="d">' + esc(d) + '</span></span>' +
            '<span class="go">' + t('wk.view') + svg('arrow-r') + '</span></a>';
        }).join('') + '</div></div>' +
      '</div>' +
      '<p class="paynote">' + svg('lock') + '<span>' + t('plans.pay') + '</span></p>' +
      '<div class="subblock"><span class="tag ok">' + svg('lock') + '<span>' + t('sub.always') + '</span></span>' +
        '<p class="sub-lead">' + t('sub.title') + '</p><p class="note" style="margin:0 0 8px">' + t('sub.lead') + '</p>' +
        '<div class="subs">' + SUBS.map(function (sb) {
          return '<article class="sub' + (sb.hl ? ' hl' : '') + '"><span class="plan-name" style="font-size:.8125rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)">' + t('sub.' + sb.id) + '</span>' +
            '<div class="price">' + sb.price + '<small>' + t('sub.month') + '</small></div>' +
            '<div class="sub-t"><b>' + t('sub.' + sb.id + '.h') + '</b><span>' + t('sub.' + sb.id + '.s') + '</span></div>' + featList(sb.feats) + '</article>';
        }).join('') + '</div>' +
        '<p class="paynote" style="margin-top:8px">' + svg('bell') + '<span>' + t('sub.note') + '</span></p></div>' +
    '</article>';

function renderCat() {
  var host = $('#prods'); if (!host) return;
  host.innerHTML = [1, 2, 3].map(function (n) {
    return '<li class="prod"><div class="ph" aria-hidden="true">' + svg('image') + '</div><b>' + t('cat.demo.item') + ' ' + n + '</b>' +
      '<button type="button" class="btn ghost" data-add="1">' + svg('plus') + '<span>' + t('cat.demo.add') + '</span></button></li>';
  }).join('');
  $('#cartN').textContent = cart.count;
  var st = $('#cartState'), m = cart.msg;
  var html = m === 'hint' ? t('cat.demo.hint')
           : m === 'empty' ? t('cat.demo.empty')
           : m === 'sent' ? t('cat.demo.sent', { n: cart.count })
           : t('cat.demo.count', { n: cart.count });
  st.innerHTML = svg(m === 'empty' ? 'alert' : 'bell') + '<span>' + html + '</span>';
  st.className = 'state' + (m === 'sent' ? ' ok' : m === 'empty' ? ' warn' : '');
}

function invStatus(s) { return s === 0 ? 'out' : s <= 3 ? 'low' : s >= 9 ? 'high' : 'ok'; }
function renderInv() {
  var host = $('#invRows'); if (!host) return;
  host.innerHTML = inv.map(function (it, i) {
    var st = invStatus(it.stock), cls = st === 'out' ? 'out' : st === 'low' ? 'low' : 'ok';
    var ico = st === 'out' ? 'ban' : st === 'low' ? 'alert' : 'check';
    var pct = Math.round(it.stock / INV_MAX * 100);
    return '<li class="inv-row"><div><div class="name">' + t('inv.item') + ' ' + it.n + '</div>' +
      '<span class="stat ' + cls + '">' + svg(ico) + '<span>' + t('inv.st.' + st) + '</span> · <span class="qty">' + it.stock + '</span> ' + t('inv.units') + '</span></div>' +
      '<button type="button" class="btn ghost sm" data-sell="' + i + '"' + (it.stock === 0 ? ' disabled aria-disabled="true" style="opacity:.45;cursor:not-allowed"' : '') + '>' + t('inv.sell') + '</button>' +
      '<div class="meter ' + cls + '" aria-hidden="true"><i style="width:' + pct + '%"></i></div></li>';
  }).join('');
  var el = $('#invState'), a = invAlert, html, ico = 'bell', cls = 'state';
  if (!a) html = t('inv.hint');
  else {
    var p = t('inv.item') + ' ' + a.n;
    if (a.kind === 'out') { html = t('inv.alert.out', { p: p }); ico = 'ban'; cls += ' warn'; }
    else if (a.kind === 'low') { html = t('inv.alert.low', { p: p, n: a.stock }); ico = 'alert'; cls += ' warn'; }
    else { html = t('inv.alert.ok', { p: p, n: a.stock }); ico = 'check'; cls += ' ok'; }
  }
  el.innerHTML = svg(ico) + '<span>' + html + '</span>'; el.className = cls;
}

function renderAgenda() {
  var host = $('#slots'); if (!host) return;
  host.innerHTML = agenda.map(function (s, i) {
    var label = s.s === 'taken' ? t('agenda.taken') : s.s === 'mine' ? t('agenda.mine') : t('agenda.free');
    var ico = s.s === 'taken' ? 'lock' : s.s === 'mine' ? 'check' : 'plus';
    return '<li><button type="button" class="slot' + (s.s === 'mine' ? ' mine' : '') + '" style="width:100%" data-slot="' + i + '"' +
      (s.s === 'taken' ? ' aria-disabled="true"' : '') + (s.s === 'mine' ? ' aria-pressed="true"' : '') + '>' +
      '<span>' + s.t + '</span><small>' + svg(ico) + label + '</small></button></li>';
  }).join('');
  var el = $('#agendaState');
  el.innerHTML = svg(agendaMsg ? 'check' : 'bell') + '<span>' + (agendaMsg ? t('agenda.booked', { t: agendaMsg }) : t('agenda.hint')) + '</span>';
  el.className = 'state' + (agendaMsg ? ' ok' : '');
}

function renderContact() {
  var row = $('#contactRow'); if (!row) return;
  var extra = '';
  if (CONFIG.whatsapp) extra += '<a class="btn primary" target="_blank" rel="noopener noreferrer" href="https://wa.me/' + esc(CONFIG.whatsapp) + '?text=' + encodeURIComponent(t('ct.wa.msg')) + '">' + svg('chat') + '<span>' + t('ct.wa') + '</span></a>';
  if (CONFIG.email) extra += '<a class="btn ghost" href="mailto:' + esc(CONFIG.email) + '"><span>' + t('ct.mail') + '</span></a>';
  var back = '<a class="btn ' + (extra ? 'ghost' : 'primary') + '" href="#servicios"><span>' + t('ct.cta') + '</span>' + svg('arrow-r') + '</a>';
  row.innerHTML = extra + back;
}

/* =====================================================================
   Idioma y tema
   ===================================================================== */
function applyLang() {
  root.lang = lang === 'en' ? 'en' : 'es-CO'; root.setAttribute('data-lang', lang);
  document.title = t('doc.title');
  $$('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
  $$('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
  $$('.seg [data-setlang]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-setlang') === lang); });
  renderProblems(); renderPlans(); renderInvPlans(); renderAgPro(); renderCat(); renderInv(); renderAgenda(); renderContact();
  applyThemeLabel(); var mb = $('#menuBtn'); if (mb) mb.setAttribute('aria-label', t(mb.getAttribute('aria-expanded') === 'true' ? 'menu.close' : 'menu.open'));
}
function applyThemeLabel() {
  var b = $('#theme'); if (b) b.setAttribute('aria-checked', theme === 'dark');
  var m = $('meta[name="theme-color"]'); if (m) m.setAttribute('content', theme === 'dark' ? '#0E1D2F' : '#F5F7FB');
}
function setLang(l) { lang = l; store('kafel-lang', l); applyLang(); }
function setTheme(th) {
  function apply() { theme = th; root.setAttribute('data-theme', th); store('kafel-theme', th); applyThemeLabel(); }
  if (reduceMotion) { apply(); return; }
  var r = $('#theme').getBoundingClientRect();
  root.style.setProperty('--vx', (r.left + r.width / 2) + 'px'); root.style.setProperty('--vy', (r.top + r.height / 2) + 'px');
  if (document.startViewTransition) {
    root.classList.add('theming');
    var vt = document.startViewTransition(apply);
    vt.finished.then(function () { root.classList.remove('theming'); }, function () { root.classList.remove('theming'); });
  } else {
    var sw = document.createElement('div'); sw.className = 'sweep'; document.body.appendChild(sw);
    setTimeout(function () { sw.remove(); }, 800); apply();
  }
}

/* =====================================================================
   Servicios (acordeón)
   ===================================================================== */
function openService(id, scroll) {
  $$('.srv').forEach(function (s) {
    var open = s.dataset.id === id;
    var head = $('.srv-head', s), panel = $('.srv-panel', s);
    head.setAttribute('aria-expanded', open); panel.classList.toggle('open', open);
    if (open) panel.removeAttribute('inert'); else panel.setAttribute('inert', '');
  });
  if (scroll) {
    var head = $('#h-' + id);
    var y = head.getBoundingClientRect().top + window.pageYOffset - (64 + 16);
    window.scrollTo({ top: y, behavior: reduceMotion ? 'auto' : 'smooth' });
  }
}
function toggleService(id) {
  var head = $('#h-' + id);
  if (head.getAttribute('aria-expanded') === 'true') {
    head.setAttribute('aria-expanded', 'false'); var p = $('#p-' + id); p.classList.remove('open'); p.setAttribute('inert', '');
  } else openService(id, true);
}

/* =====================================================================
   Eventos
   ===================================================================== */
document.addEventListener('click', function (e) {
  var el;
  if ((el = e.target.closest('[data-setlang]'))) { setLang(el.getAttribute('data-setlang')); return; }
  if (e.target.closest('#theme')) { if (swDragged) { swDragged = false; return; } setTheme(theme === 'dark' ? 'light' : 'dark'); return; }
  if (e.target.closest('#fs')) {
    if (document.fullscreenElement) document.exitFullscreen(); else root.requestFullscreen().catch(function () {}); return;
  }
  if ((el = e.target.closest('[data-go]'))) { openService(el.getAttribute('data-go'), true); return; }
  if ((el = e.target.closest('.srv-head'))) { toggleService(el.closest('.srv').dataset.id); return; }
  if ((el = e.target.closest('.reveal-btn'))) { var c = el.closest('.pcard'); setCard(c, !c.classList.contains('open')); updateToggleAll(); return; }
  if (e.target.closest('#toggleAll')) {
    var cards = $$('.pcard'); var all = cards.every(function (c) { return c.classList.contains('open'); });
    cards.forEach(function (c) { setCard(c, !all); }); updateToggleAll(); return;
  }
  if (e.target.closest('[data-add]')) { cart.count++; cart.msg = 'count'; renderCat(); return; }
  if (e.target.closest('#cartSend')) { cart.msg = cart.count ? 'sent' : 'empty'; renderCat(); return; }
  if ((el = e.target.closest('[data-sell]'))) {
    var it = inv[+el.getAttribute('data-sell')]; if (!it || it.stock === 0) return;
    it.stock--; invAlert = { n: it.n, stock: it.stock, kind: it.stock === 0 ? 'out' : it.stock <= 3 ? 'low' : 'ok' };
    renderInv();
    var again = $('[data-sell="' + inv.indexOf(it) + '"]'); if (again && !again.disabled) again.focus(); return;
  }
  if (e.target.closest('#invReset')) { resetInv(); renderInv(); return; }
  if ((el = e.target.closest('[data-slot]'))) {
    var i = +el.getAttribute('data-slot'), s = agenda[i];
    if (s.s === 'taken') return;
    agenda.forEach(function (x) { if (x.s === 'mine') x.s = 'free'; });
    s.s = 'mine'; agendaMsg = s.t; renderAgenda();
    var f = $('[data-slot="' + i + '"]'); if (f) f.focus(); return;
  }
  if (e.target.closest('#agendaReset')) { resetAgenda(); renderAgenda(); return; }
  if ((el = e.target.closest('[data-plan]'))) {
    var id = el.getAttribute('data-plan'); selPlan = selPlan === id ? null : id; renderPlans();
    var again = $('[data-plan="' + id + '"]'); if (again) again.focus({ preventScroll: true });
    if (selPlan) setTimeout(function () { var d = $('#planDetail'); if (d) d.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' }); }, 60);
    return;
  }
  if ((el = e.target.closest('[data-invplan]'))) {
    var iid = el.getAttribute('data-invplan'); selInv = selInv === iid ? null : iid; renderInvPlans();
    var ag = $('[data-invplan="' + iid + '"]'); if (ag) ag.focus({ preventScroll: true });
    if (selInv) setTimeout(function () { var d = $('#invDetail'); if (d) d.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' }); }, 60);
    return;
  }
  if ((el = e.target.closest('.disc[aria-controls]'))) {
    var tgt = document.getElementById(el.getAttribute('aria-controls')); var open = el.getAttribute('aria-expanded') !== 'true';
    el.setAttribute('aria-expanded', open); setCollapse(tgt, open); return;
  }
  if (e.target.closest('#menuBtn')) { toggleMenu(); return; }
  if (e.target.closest('#menu a')) { toggleMenu(false); }
});


/* Switch de tema: también se puede arrastrar */
var swDragged = false;
(function () {
  var sw = $('#theme'), drag = null; if (!sw) return;
  sw.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, done: false }; });
  sw.addEventListener('pointermove', function (e) {
    if (!drag || drag.done) return; var dx = e.clientX - drag.x;
    if (Math.abs(dx) > 14) { drag.done = true; swDragged = true; var wantDark = dx > 0; if (wantDark !== (theme === 'dark')) setTheme(wantDark ? 'dark' : 'light'); }
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { sw.addEventListener(n, function () { drag = null; setTimeout(function () { swDragged = false; }, 50); }); });
})();

/* Menú de secciones (móvil y tablet) */
function toggleMenu(force) {
  var btn = $('#menuBtn'), menu = $('#menu'); if (!btn) return;
  var open = typeof force === 'boolean' ? force : btn.getAttribute('aria-expanded') !== 'true';
  btn.setAttribute('aria-expanded', open); menu.hidden = !open;
  btn.setAttribute('aria-label', t(open ? 'menu.close' : 'menu.open'));
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') toggleMenu(false); });
document.addEventListener('click', function (e) { if (!e.target.closest('#menu, #menuBtn')) toggleMenu(false); });

/* =====================================================================
   Navegación entre secciones
   ===================================================================== */
var sections = $$('main > section');
var current = 0;
function goTo(i) {
  i = Math.max(0, Math.min(sections.length - 1, i));
  sections[i].scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
}
$('#prev').addEventListener('click', function () { goTo(current - 1); });
$('#next').addEventListener('click', function () { goTo(current + 1); });
document.addEventListener('keydown', function (e) {
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  var tg = e.target; if (tg && /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); goTo(current + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(current - 1); }
});

function setCurrent(i) {
  current = i;
  var id = sections[i].id;
  $$('#links a, #dots a, #menu a').forEach(function (a) { a.setAttribute('aria-current', a.getAttribute('href') === '#' + id ? 'true' : 'false'); });
  var prev = $('#prev'), next = $('#next');
  prev.setAttribute('aria-disabled', i === 0); next.setAttribute('aria-disabled', i === sections.length - 1);
}
if ('IntersectionObserver' in window) {
  var secIO = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) { if (en.isIntersecting) setCurrent(sections.indexOf(en.target)); });
  }, { rootMargin: '-45% 0px -50% 0px' });
  sections.forEach(function (s) { secIO.observe(s); });

  var revIO = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); revIO.unobserve(en.target); } });
  }, { threshold: .12 });
  window.__observeReveal = function () { $$('.reveal:not(.in)').forEach(function (n) { revIO.observe(n); }); };
} else { $$('.reveal').forEach(function (n) { n.classList.add('in'); }); }

var ticking = false;
window.addEventListener('scroll', function () {
  if (ticking) return; ticking = true;
  requestAnimationFrame(function () {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    $('#progress').style.width = (h > 0 ? Math.min(100, window.pageYOffset / h * 100) : 0) + '%';
    ticking = false;
  });
}, { passive: true });

/* Pantalla completa solo si el navegador la soporta */
if (document.fullscreenEnabled) $('#fs').hidden = false;

/* Inicio */
applyLang(); setCurrent(0);

/* Animación de arranque (se puede saltar con un toque o cualquier tecla) */
(function () {
  var boot = $('#boot'), finished = false, timer;
  function reveal() { if (window.__observeReveal) window.__observeReveal(); }
  if (!boot) { reveal(); return; }
  if (reduceMotion) { boot.remove(); root.classList.remove('booting'); reveal(); return; }
  function finish() {
    if (finished) return; finished = true; clearTimeout(timer);
    boot.classList.add('done'); root.classList.remove('booting');
    setTimeout(function () { boot.remove(); }, 650); setTimeout(reveal, 250);
  }
  timer = setTimeout(finish, 2800);
  boot.addEventListener('click', finish);
  document.addEventListener('keydown', finish, { once: true });
})();
})();
</script>
